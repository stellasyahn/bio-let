<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{background:#F0EDE6;font-family:'Noto Serif KR',serif;min-height:100vh;}
body::before{content:'';position:fixed;inset:0;background-image:url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='%23C0B8AC' fill-opacity='0.12'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/svg%3E");pointer-events:none;z-index:0;}
#root{position:relative;z-index:1;}
::-webkit-scrollbar{width:5px;} ::-webkit-scrollbar-thumb{background:#9B9BB4;border-radius:3px;}

/* 헤더 */
.hdr{background:linear-gradient(135deg,#2D3561 0%,#1a2040 100%);position:sticky;top:0;z-index:50;box-shadow:0 4px 20px rgba(29,32,64,.3);}
.hdr-in{max-width:760px;margin:0 auto;padding:14px 20px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;}
.logo{display:flex;align-items:center;gap:12px;}
.logo-ic{width:40px;height:40px;border-radius:10px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.18);display:flex;align-items:center;justify-content:center;font-size:20px;}
.logo-t{font-family:'Playfair Display',serif;font-size:17px;font-weight:600;color:#EEE8D8;letter-spacing:.5px;}
.logo-s{font-size:9px;color:rgba(238,232,216,.45);margin-top:2px;letter-spacing:1px;}
.nav-btn{padding:7px 15px;border-radius:20px;border:1px solid rgba(255,255,255,.18);cursor:pointer;font-size:12px;font-family:'Noto Serif KR',serif;transition:all .2s;letter-spacing:.3px;}
.nav-a{background:rgba(255,255,255,.2);color:#EEE8D8;}
.nav-i{background:transparent;color:rgba(238,232,216,.55);}
.nav-btn:hover{background:rgba(255,255,255,.18);color:#EEE8D8;}
.adm-badge{padding:5px 12px;border-radius:20px;background:rgba(212,175,55,.14);color:#D4AF37;border:1px solid rgba(212,175,55,.3);font-size:11px;font-weight:600;cursor:pointer;letter-spacing:.3px;}
.sync{padding:5px 11px;border-radius:20px;font-size:10px;font-weight:600;letter-spacing:.3px;}
.sync-ok{background:rgba(74,222,128,.1);color:#4ADE80;border:1px solid rgba(74,222,128,.22);}
.sync-no{background:rgba(251,146,60,.1);color:#FB923C;border:1px solid rgba(251,146,60,.22);}

/* 콘텐츠 */
.ct{padding:22px 16px;max-width:740px;margin:0 auto;}
.hint{font-size:11px;color:#8C8070;font-style:italic;font-family:'Playfair Display',serif;margin-bottom:14px;letter-spacing:.3px;}

/* 지도 */
.map-wrap{background:#FDFAF3;border-radius:16px;border:1px solid #D4CCBB;overflow:hidden;margin-bottom:18px;box-shadow:0 4px 20px rgba(45,53,97,.07),inset 0 1px 0 rgba(255,255,255,.9);position:relative;}
.map-wrap::after{content:'Biology Lab — Floor Plan';position:absolute;top:10px;right:14px;font-family:'Playfair Display',serif;font-size:8.5px;font-style:italic;color:#B0A898;letter-spacing:.5px;}

/* 선반 그리드 */
.sg{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:9px;}
.st{background:#FDFAF3;border-radius:12px;border:1px solid #D4CCBB;border-left:3px solid #2D3561;padding:11px 14px;cursor:pointer;transition:all .18s;box-shadow:0 1px 6px rgba(45,53,97,.05);}
.st:hover{transform:translateY(-2px);box-shadow:0 6px 16px rgba(45,53,97,.12);border-left-color:#4A5491;}
.st-n{font-size:13px;font-weight:600;color:#2D3561;margin-bottom:3px;}
.st-s{font-size:11px;color:#8C8070;}

/* 카드 */
.card{background:#FDFAF3;border-radius:13px;border:1px solid #D4CCBB;padding:15px 17px;margin-bottom:11px;box-shadow:0 1px 8px rgba(45,53,97,.04);}
.icard{background:#F5F0E8;border-radius:9px;border:1px solid #DDD5C5;padding:10px 12px;margin-bottom:6px;}

/* 버튼 */
.bp{padding:8px 17px;border-radius:10px;border:none;cursor:pointer;background:#2D3561;color:#EEE8D8;font-size:12px;font-family:'Noto Serif KR',serif;font-weight:600;letter-spacing:.3px;transition:all .15s;}
.bp:hover{background:#3D4571;}
.bs{padding:8px 13px;border-radius:10px;border:1px solid #C8C0B0;cursor:pointer;background:#FDFAF3;color:#5C5448;font-size:12px;font-family:'Noto Serif KR',serif;}
.bg{padding:5px 11px;border-radius:7px;border:1px solid #C8C0B0;cursor:pointer;background:#FDFAF3;color:#6B6358;font-size:11px;}
.bd{padding:5px 11px;border-radius:7px;border:1px solid #F0C0C0;cursor:pointer;background:#FDF2F2;color:#B83232;font-size:11px;}
.badd{width:100%;padding:8px;border:1.5px dashed #C8C0B0;background:transparent;border-radius:9px;cursor:pointer;font-size:12px;color:#8C8070;font-family:'Noto Serif KR',serif;display:flex;align-items:center;justify-content:center;gap:6px;transition:all .15s;}
.badd:hover{background:#F0EBE0;color:#2D3561;border-color:#9B9BB4;}

/* 인풋 */
.inp{padding:9px 13px;border-radius:9px;border:1px solid #C8C0B0;background:#FDFAF3;color:#2D3561;font-size:13px;font-family:'Noto Serif KR',serif;outline:none;width:100%;}
.inp:focus{border-color:#2D3561;box-shadow:0 0 0 3px rgba(45,53,97,.07);}
.lbl{font-size:11px;font-weight:600;color:#6B6358;margin-bottom:4px;display:block;letter-spacing:.3px;}

/* 태그 */
.tag{display:inline-block;padding:2px 8px;border-radius:99px;font-size:10px;font-weight:600;}
.sdot{display:inline-block;width:7px;height:7px;border-radius:99px;margin-right:4px;flex-shrink:0;}

/* 모달 */
.ov{position:fixed;inset:0;background:rgba(20,18,32,.42);display:flex;align-items:center;justify-content:center;z-index:200;backdrop-filter:blur(4px);}
.md{background:#FDFAF3;border-radius:18px;padding:26px;width:330px;max-width:92vw;box-shadow:0 24px 60px rgba(20,18,32,.22);border:1px solid #D4CCBB;max-height:90vh;overflow-y:auto;}
.md-t{font-family:'Playfair Display',serif;font-size:17px;font-weight:600;color:#2D3561;margin-bottom:16px;letter-spacing:.3px;}

/* 로딩 */
.loading{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;}

/* 토스트 */
.toast{position:fixed;top:16px;left:50%;transform:translateX(-50%);padding:9px 20px;border-radius:99px;font-size:12px;font-weight:600;font-family:'Noto Serif KR',serif;z-index:9999;pointer-events:none;white-space:nowrap;box-shadow:0 8px 24px rgba(0,0,0,.14);letter-spacing:.3px;}
.tok{background:#2D3561;color:#EEE8D8;} .toi{background:#6B6358;color:#F2EDE3;}

/* 기타 */
.epty{text-align:center;padding:56px 20px;color:#8C8070;font-style:italic;font-family:'Playfair Display',serif;}
.pin-err{color:#B83232;font-size:11px;margin-bottom:7px;text-align:center;font-style:italic;}
.fnum{width:26px;height:26px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;background:#2D356112;color:#2D3561;}
</style>

<body>
<div id="root"></div>
<script type="text/babel">
const {useState,useEffect,useCallback,useRef}=React;
const DEFAULT_PIN="1234";
const ITEM_COLORS=[
  {label:"기본",value:"#94A3B8"},{label:"빨강",value:"#B83232"},
  {label:"주황",value:"#C85A1A"},{label:"노랑",value:"#A08010"},
  {label:"초록",value:"#1E7A44"},{label:"군청",value:"#2D3561"},
  {label:"보라",value:"#622C82"},{label:"갈색",value:"#7A4A1E"},
];
const STATUS_OPTIONS=[
  {value:"정상",color:"#1E7A44"},{value:"부족",color:"#C85A1A"},
  {value:"점검필요",color:"#B83232"},{value:"없음",color:"#94A3B8"},
];
const genId=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const makeFloors=(id,n)=>Array.from({length:n},(_,i)=>({id:`${id}-fl${i+1}`,label:`${i+1}층`,items:[]}));
const emptyItem=()=>({id:genId(),name:"",color:"#2D3561",qty:1,status:"정상",memo:""});
const INIT_SHELVES=[
  {id:"L1",name:"왼쪽 선반 1",color:"#2D3561",floors:makeFloors("L1",2),mapShape:"L1"},
  {id:"L2",name:"왼쪽 선반 2",color:"#2D3561",floors:makeFloors("L2",2),mapShape:"L2"},
  {id:"L3",name:"왼쪽 선반 3",color:"#2D3561",floors:makeFloors("L3",2),mapShape:"L3"},
  {id:"L4",name:"왼쪽 선반 4",color:"#2D3561",floors:makeFloors("L4",2),mapShape:"L4"},
  {id:"L5",name:"왼쪽 선반 5",color:"#2D3561",floors:makeFloors("L5",2),mapShape:"L5"},
  {id:"L6",name:"왼쪽 선반 6",color:"#2D3561",floors:makeFloors("L6",2),mapShape:"L6"},
  {id:"drug",name:"약품보관장",color:"#2D3561",floors:makeFloors("drug",2),mapShape:"drug"},
  {id:"R1",name:"오른쪽 선반",color:"#2D3561",floors:makeFloors("R1",1),mapShape:"R1"},
];
const SHELF_MAP={
  L1:{x:40,y:70,w:72,h:52},L2:{x:40,y:122,w:72,h:52},L3:{x:40,y:174,w:72,h:52},
  L4:{x:40,y:226,w:72,h:52},L5:{x:40,y:278,w:72,h:52},L6:{x:40,y:330,w:72,h:52},
  drug:{x:350,y:20,w:110,h:90},R1:{x:350,y:110,w:110,h:60},
};

function LabMap({shelves,onSelect,selectedId}){
  const W=500,H=420,INK="#2D3561";
  const getS=s=>shelves.find(x=>x.mapShape===s);
  const total=sh=>sh?sh.floors.reduce((a,f)=>a+f.items.length,0):0;
  const renderShelf=shape=>{
    const sh=getS(shape);if(!sh)return null;
    const{x,y,w,h}=SHELF_MAP[shape];
    const sel=sh.id===selectedId,cnt=total(sh),nf=sh.floors.length;
    return(
      <g key={shape} onClick={()=>onSelect(sh.id)} style={{cursor:"pointer"}}>
        {sel&&<rect x={x-4} y={y-4} width={w+8} height={h+8} rx={8} fill="none" stroke={INK} strokeWidth={2} opacity={.28} strokeDasharray="5 3"/>}
        <rect x={x} y={y} width={w} height={h} rx={4} fill={sel?"#2D356120":"#2D35610D"} stroke={INK} strokeWidth={sel?2:1.2}/>
        {Array.from({length:nf-1},(_,i)=>{const ly=y+(h/nf)*(i+1);return<line key={i} x1={x+5} y1={ly} x2={x+w-5} y2={ly} stroke={INK} strokeWidth={.7} opacity={.3} strokeDasharray="3 2"/>;}) }
        <circle cx={x+5} cy={y+5} r={1.5} fill={INK} opacity={.18}/>
        <circle cx={x+w-5} cy={y+5} r={1.5} fill={INK} opacity={.18}/>
        <circle cx={x+5} cy={y+h-5} r={1.5} fill={INK} opacity={.18}/>
        <circle cx={x+w-5} cy={y+h-5} r={1.5} fill={INK} opacity={.18}/>
        {cnt>0
          ?<text x={x+w/2} y={y+h/2+4} textAnchor="middle" fontSize={9} fill={INK} fontWeight="700" fontFamily="'Playfair Display',serif" opacity={.8}>{cnt}종</text>
          :<text x={x+w/2} y={y+h/2+4} textAnchor="middle" fontSize={7.5} fill={INK} opacity={.25} fontStyle="italic" fontFamily="'Playfair Display',serif">empty</text>
        }
      </g>
    );
  };
  return(
    <svg viewBox={`0 0 ${W} ${H}`} style={{width:"100%",display:"block",maxHeight:450}}>
      <defs>
        <pattern id="grid" width="22" height="22" patternUnits="userSpaceOnUse">
          <path d="M 22 0 L 0 0 0 22" fill="none" stroke="#C0B8A8" strokeWidth=".25" opacity=".6"/>
        </pattern>
      </defs>
      <rect x={40} y={20} width={420} height={380} rx={6} fill="url(#grid)"/>
      <rect x={40} y={20} width={420} height={380} rx={6} fill="rgba(253,250,243,.75)" stroke="#B0A890" strokeWidth={2}/>
      <rect x={40} y={20} width={420} height={380} rx={6} fill="none" stroke="#7B7060" strokeWidth={3}/>

      {/* 상단 교사구역 */}
      <rect x={40} y={20} width={310} height={50} fill="#E8E0CE" stroke="#C0B8A0" strokeWidth={.8}/>
      <text x={195} y={49} textAnchor="middle" fontSize={8.5} fill="#8C8070" fontFamily="'Playfair Display',serif" fontStyle="italic">교사 구역</text>

      {/* 기타 가구 */}
      {[{x:135,y:73,w:50,h:30,t:"폐수통"},{x:191,y:73,w:58,h:30,t:"인큐베이터"},{x:255,y:73,w:50,h:30,t:"냉장고"}].map(({x,y,w,h,t})=>(
        <g key={t}>
          <rect x={x} y={y} width={w} height={h} rx={3} fill="#EDE5D5" stroke="#C0B8A0" strokeWidth={.8}/>
          <text x={x+w/2} y={y+h/2+3.5} textAnchor="middle" fontSize={7.5} fill="#7B7060" fontFamily="serif">{t}</text>
        </g>
      ))}
      <rect x={392} y={172} width={68} height={118} rx={3} fill="#EDE5D5" stroke="#C0B8A0" strokeWidth={.8}/>
      <text x={426} y={234} textAnchor="middle" fontSize={8.5} fill="#7B7060" fontFamily="serif">싱크대</text>
      <rect x={310} y={350} width={150} height={50} rx={3} fill="#EDE5D5" stroke="#C0B8A0" strokeWidth={.8}/>
      <text x={385} y={379} textAnchor="middle" fontSize={8.5} fill="#7B7060" fontFamily="serif">책상</text>

      {/* 칠판 */}
      <rect x={112} y={358} width={170} height={32} rx={3} fill="#2D356114" stroke="#2D3561" strokeWidth={1.1} opacity={.65}/>
      <text x={197} y={378} textAnchor="middle" fontSize={10} fill="#2D3561" fontWeight="600" fontFamily="'Playfair Display',serif">칠 판</text>

      {/* 출입문 */}
      <rect x={40} y={20} width={26} height={16} fill="#F5F0E5" stroke="#9B9280" strokeWidth={1}/>
      <text x={53} y={31} textAnchor="middle" fontSize={5.5} fill="#8C8070">출입</text>
      <path d="M40 36 Q53 36 66 20" fill="none" stroke="#9B9280" strokeWidth={.9} strokeDasharray="2.5 2"/>
      <rect x={40} y={384} width={26} height={16} fill="#F5F0E5" stroke="#9B9280" strokeWidth={1}/>
      <text x={53} y={395} textAnchor="middle" fontSize={5.5} fill="#8C8070">출입</text>
      <path d="M40 384 Q53 384 66 400" fill="none" stroke="#9B9280" strokeWidth={.9} strokeDasharray="2.5 2"/>

      {["L1","L2","L3","L4","L5","L6","drug","R1"].map(s=>renderShelf(s))}

      {shelves.filter(s=>s.mapShape==="custom").map((sh,i)=>{
        const x=130+i*70,y=155,w=58,h=44,sel=sh.id===selectedId;
        return(
          <g key={sh.id} onClick={()=>onSelect(sh.id)} style={{cursor:"pointer"}}>
            {sel&&<rect x={x-3} y={y-3} width={w+6} height={h+6} rx={8} fill="none" stroke={INK} strokeWidth={1.8} opacity={.3}/>}
            <rect x={x} y={y} width={w} height={h} rx={4} fill={sel?"#2D356120":"#2D35610D"} stroke={INK} strokeWidth={sel?2:1.2}/>
            <text x={x+w/2} y={y+h/2+4} textAnchor="middle" fontSize={8} fontWeight="700" fill={INK} fontFamily="serif">{sh.name.length>5?sh.name.slice(0,4)+"…":sh.name}</text>
          </g>
        );
      })}
      <rect x={46} y={390} width={7} height={7} rx={1} fill={INK} opacity={.6}/>
      <text x={57} y={397} fontSize={6.5} fill="#8C8070" fontStyle="italic">선반 (클릭하여 기자재 확인)</text>
    </svg>
  );
}

function ShelfFrontView({shelf}){
  const n=shelf.floors.length,FH=n<=2?90:n<=4?72:n<=6?54:44;
  const SVG_H=n*FH+44,W=440,L=28,R=W-28,TOP=26,INK="#2D3561";
  return(
    <svg viewBox={`0 0 ${W} ${SVG_H}`} style={{width:"100%",display:"block"}}>
      <rect x={L} y={TOP} width={R-L} height={n*FH} rx={5} fill="#F7F2E8" stroke={INK} strokeWidth={1.4}/>
      {shelf.floors.map((floor,fi)=>{
        const yT=TOP+fi*FH,yB=yT+FH,isLast=fi===n-1;
        const IW=52,IH=FH-14,GAP=5,maxV=Math.floor((R-L-46)/(IW+GAP));
        return(
          <g key={floor.id}>
            {!isLast&&<line x1={L+6} y1={yB} x2={R-6} y2={yB} stroke={INK} strokeWidth={.7} opacity={.22} strokeDasharray="4 3"/>}
            <text x={L+10} y={yT+FH/2+4} fontSize={8.5} fontWeight="700" fill={INK} opacity={.45} fontFamily="'Playfair Display',serif" fontStyle="italic">{floor.label}</text>
            {floor.items.slice(0,maxV).map((item,ii)=>{
              const ix=L+38+ii*(IW+GAP),iy=yT+6,col=item.color||INK;
              const stOpt=STATUS_OPTIONS.find(s=>s.value===item.status)||STATUS_OPTIONS[0];
              return(
                <g key={item.id}>
                  <rect x={ix} y={iy} width={IW} height={IH} rx={4} fill={col+"15"} stroke={col} strokeWidth={1.1}/>
                  <rect x={ix+4} y={iy+4} width={IW-8} height={4.5} rx={2} fill={col} opacity={.4}/>
                  <text x={ix+IW/2} y={iy+IH-12} textAnchor="middle" fontSize={7} fill={col} fontWeight="600" fontFamily="serif">{item.name.length>7?item.name.slice(0,6)+"…":item.name}</text>
                  {item.qty!=null&&<text x={ix+IW/2} y={iy+IH-3} textAnchor="middle" fontSize={6} fill={col} opacity={.65}>×{item.qty}</text>}
                  <circle cx={ix+IW-7} cy={iy+8} r={3} fill={stOpt.color}/>
                </g>
              );
            })}
            {floor.items.length>maxV&&<text x={R-5} y={yT+FH/2+4} textAnchor="end" fontSize={8} fill={INK} opacity={.45}>+{floor.items.length-maxV}</text>}
            {floor.items.length===0&&<text x={L+48} y={yT+FH/2+4} fontSize={8.5} fill="#C0B8A8" fontStyle="italic" fontFamily="'Playfair Display',serif">empty</text>}
          </g>
        );
      })}
    </svg>
  );
}

function App(){
  const[shelves,setShelves]=useState(INIT_SHELVES);
  const[adminPin,setAdminPin]=useState(DEFAULT_PIN);
  const[loaded,setLoaded]=useState(false);
  const[synced,setSynced]=useState(false);
  const[isAdmin,setIsAdmin]=useState(false);
  const[view,setView]=useState("map");
  const[selId,setSelId]=useState(null);
  const[searchQ,setSearchQ]=useState("");
  const[toast,setToast]=useState(null);
  const[showPin,setShowPin]=useState(false);
  const[pinInput,setPinInput]=useState("");
  const[pinErr,setPinErr]=useState(false);
  const[showCP,setShowCP]=useState(false);
  const[cpOld,setCpOld]=useState("");const[cpNew,setCpNew]=useState("");const[cpNew2,setCpNew2]=useState("");const[cpErr,setCpErr]=useState("");
  const[itemForm,setItemForm]=useState(null);
  const[renaming,setRenaming]=useState(null);
  const[renameText,setRenameText]=useState("");

  useEffect(()=>{
    const ref=db.ref("biolab");
    ref.on("value",snap=>{
      const d=snap.val();
      if(d){if(d.shelves)setShelves(d.shelves);if(d.adminPin)setAdminPin(d.adminPin);setSynced(true);}
      setLoaded(true);
    },()=>setLoaded(true));
    return()=>ref.off();
  },[]);

  const persist=useCallback((s,pin)=>{db.ref("biolab").set({shelves:s,adminPin:pin}).catch(()=>{});},[]);
  const updateShelves=useCallback(fn=>{setShelves(prev=>{const next=fn(prev);persist(next,adminPin);return next;});},[adminPin,persist]);
  const toast_=(msg,t="ok")=>{setToast({msg,t});setTimeout(()=>setToast(null),2200);};

  const currentShelf=shelves.find(s=>s.id===selId);
  const searchResults=searchQ.trim()?(()=>{const q=searchQ.toLowerCase(),res=[];shelves.forEach(sh=>sh.floors.forEach(fl=>fl.items.forEach(it=>{if(it.name.toLowerCase().includes(q))res.push({it,fl,sh});})));return res;})():[];

  const tryLogin=()=>{if(pinInput===adminPin){setIsAdmin(true);setShowPin(false);setPinInput("");setPinErr(false);toast_("관리자 모드 활성화");}else{setPinErr(true);setPinInput("");}};
  const tryChangePin=()=>{
    if(cpOld!==adminPin){setCpErr("현재 PIN이 올바르지 않아요");return;}
    if(cpNew.length<4){setCpErr("4자리 이상 입력해주세요");return;}
    if(cpNew!==cpNew2){setCpErr("새 PIN이 일치하지 않아요");return;}
    setAdminPin(cpNew);persist(shelves,cpNew);
    setCpOld("");setCpNew("");setCpNew2("");setCpErr("");setShowCP(false);toast_("PIN 변경 완료");
  };
  const openAddItem=(sid,fid)=>setItemForm({mode:"add",shelfId:sid,floorId:fid,item:emptyItem()});
  const openEditItem=(sid,fid,item)=>setItemForm({mode:"edit",shelfId:sid,floorId:fid,item:{...item}});
  const upd=(k,v)=>setItemForm(f=>({...f,item:{...f.item,[k]:v}}));
  const saveItem=()=>{
    if(!itemForm||!itemForm.item.name.trim())return;
    const{mode,shelfId,floorId,item}=itemForm;
    if(mode==="add"){updateShelves(p=>p.map(s=>s.id!==shelfId?s:{...s,floors:s.floors.map(f=>f.id!==floorId?f:{...f,items:[...f.items,{...item,id:genId()}]})}));toast_("기자재 등록 완료");}
    else{updateShelves(p=>p.map(s=>s.id!==shelfId?s:{...s,floors:s.floors.map(f=>f.id!==floorId?f:{...f,items:f.items.map(i=>i.id!==item.id?i:{...item})})}));toast_("수정 완료");}
    setItemForm(null);
  };
  const deleteItem=(sid,fid,iid)=>{updateShelves(p=>p.map(s=>s.id!==sid?s:{...s,floors:s.floors.map(f=>f.id!==fid?f:{...f,items:f.items.filter(i=>i.id!==iid)})}));toast_("삭제됨","i");};
  const renameShelf=sid=>{if(!renameText.trim())return;updateShelves(p=>p.map(s=>s.id!==sid?s:{...s,name:renameText.trim()}));setRenaming(null);toast_("이름 변경");};
  const deleteShelf=sid=>{if(!window.confirm("이 선반을 삭제할까요?"))return;updateShelves(p=>p.filter(s=>s.id!==sid));setView("map");setSelId(null);toast_("삭제됨","i");};

  if(!loaded)return(
    <div className="loading">
      <div style={{fontSize:38}}>🔬</div>
      <div style={{fontFamily:"'Playfair Display',serif",fontSize:17,color:"#2D3561",fontStyle:"italic"}}>Biology Lab</div>
      <div style={{fontSize:12,color:"#8C8070"}}>데이터를 불러오는 중…</div>
    </div>
  );

  return(
    <div style={{minHeight:"100vh"}}>
      {toast&&<div className={`toast t${toast.t}`} style={toast.t==="ok"?{background:"#2D3561",color:"#EEE8D8"}:{background:"#6B6358",color:"#F2EDE3"}}>{toast.msg}</div>}

      {/* PIN 모달 */}
      {showPin&&(
        <div className="ov" onClick={()=>{setShowPin(false);setPinErr(false);setPinInput("");}}>
          <div className="md" onClick={e=>e.stopPropagation()}>
            <div className="md-t">관리자 로그인</div>
            <div style={{fontSize:12,color:"#8C8070",marginBottom:16,fontStyle:"italic"}}>PIN 번호를 입력하세요</div>
            <input type="password" value={pinInput} onChange={e=>setPinInput(e.target.value)} onKeyDown={e=>e.key==="Enter"&&tryLogin()} placeholder="• • • •" className="inp" style={{letterSpacing:8,textAlign:"center",marginBottom:8}} autoFocus/>
            {pinErr&&<div className="pin-err">올바르지 않은 PIN이에요</div>}
            <div style={{display:"flex",gap:8,marginTop:4}}><button onClick={tryLogin} className="bp" style={{flex:1}}>확인</button><button onClick={()=>{setShowPin(false);setPinErr(false);setPinInput("");}} className="bs" style={{flex:1}}>취소</button></div>
          </div>
        </div>
      )}

      {/* PIN 변경 */}
      {showCP&&(
        <div className="ov" onClick={()=>{setShowCP(false);setCpOld("");setCpNew("");setCpNew2("");setCpErr("");}}>
          <div className="md" onClick={e=>e.stopPropagation()}>
            <div className="md-t">PIN 변경</div>
            {[{l:"현재 PIN",v:cpOld,s:setCpOld},{l:"새 PIN",v:cpNew,s:setCpNew},{l:"새 PIN 확인",v:cpNew2,s:setCpNew2}].map(({l,v,s})=>(
              <div key={l} style={{marginBottom:11}}><label className="lbl">{l}</label><input type="password" value={v} onChange={e=>s(e.target.value)} className="inp" style={{letterSpacing:6,textAlign:"center"}}/></div>
            ))}
            {cpErr&&<div className="pin-err">{cpErr}</div>}
            <div style={{display:"flex",gap:8,marginTop:4}}><button onClick={tryChangePin} className="bp" style={{flex:1}}>변경</button><button onClick={()=>setShowCP(false)} className="bs" style={{flex:1}}>취소</button></div>
          </div>
        </div>
      )}

      {/* 기자재 폼 */}
      {itemForm&&(
        <div className="ov" onClick={()=>setItemForm(null)}>
          <div className="md" onClick={e=>e.stopPropagation()}>
            <div className="md-t">{itemForm.mode==="add"?"기자재 등록":"기자재 수정"}</div>
            <label className="lbl">기자재 이름 *</label>
            <input value={itemForm.item.name} onChange={e=>upd("name",e.target.value)} onKeyDown={e=>e.key==="Enter"&&saveItem()} placeholder="예: 비커, 현미경…" className="inp" style={{marginBottom:13}} autoFocus/>
            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:11,marginBottom:13}}>
              <div>
                <label className="lbl">수량</label>
                <div style={{display:"flex",alignItems:"center",gap:4}}>
                  <button onClick={()=>upd("qty",Math.max(0,(itemForm.item.qty||1)-1))} style={{width:30,height:30,borderRadius:7,border:"1px solid #C8C0B0",background:"#F0EBE0",cursor:"pointer",fontSize:15,fontWeight:700,color:"#2D3561",flexShrink:0}}>−</button>
                  <input type="number" min="0" value={itemForm.item.qty??1} onChange={e=>upd("qty",Math.max(0,parseInt(e.target.value)||0))} className="inp" style={{textAlign:"center",padding:"7px 4px"}}/>
                  <button onClick={()=>upd("qty",(itemForm.item.qty||1)+1)} style={{width:30,height:30,borderRadius:7,border:"1px solid #C8C0B0",background:"#F0EBE0",cursor:"pointer",fontSize:15,fontWeight:700,color:"#2D3561",flexShrink:0}}>＋</button>
                </div>
              </div>
              <div>
                <label className="lbl">상태</label>
                <select value={itemForm.item.status||"정상"} onChange={e=>upd("status",e.target.value)} className="inp" style={{padding:"8px 9px",cursor:"pointer"}}>
                  {STATUS_OPTIONS.map(s=><option key={s.value} value={s.value}>{s.value}</option>)}
                </select>
              </div>
            </div>
            <label className="lbl">색상</label>
            <div style={{display:"flex",gap:6,flexWrap:"wrap",marginBottom:13}}>
              {ITEM_COLORS.map(c=><button key={c.value} onClick={()=>upd("color",c.value)} title={c.label} style={{width:22,height:22,borderRadius:99,border:itemForm.item.color===c.value?"3px solid #2D3561":"3px solid transparent",background:c.value,cursor:"pointer",padding:0,transition:"border .1s"}}/>)}
            </div>
            <label className="lbl">메모</label>
            <textarea value={itemForm.item.memo||""} onChange={e=>upd("memo",e.target.value)} placeholder="보관 위치, 주의사항 등…" rows={3} className="inp" style={{resize:"vertical",marginBottom:15,fontFamily:"'Noto Serif KR',serif",lineHeight:1.6}}/>
            <div style={{display:"flex",gap:8}}>
              <button onClick={saveItem} className="bp" style={{flex:1}}>{itemForm.mode==="add"?"등록":"저장"}</button>
              <button onClick={()=>setItemForm(null)} className="bs" style={{flex:1}}>취소</button>
            </div>
          </div>
        </div>
      )}

      {/* 헤더 */}
      <div className="hdr">
        <div className="hdr-in">
          <div className="logo">
            <div className="logo-ic">🔬</div>
            <div><div className="logo-t">Biology Lab</div><div className="logo-s">SPECIMEN & EQUIPMENT REGISTRY</div></div>
          </div>
          <div style={{display:"flex",gap:7,alignItems:"center",flexWrap:"wrap"}}>
            <div className={`sync ${synced?"sync-ok":"sync-no"}`}>{synced?"● live":"○ 연결 중"}</div>
            <button className={`nav-btn ${view==="map"?"nav-a":"nav-i"}`} onClick={()=>{setView("map");setSelId(null);}}>약도</button>
            <button className={`nav-btn ${view==="search"?"nav-a":"nav-i"}`} onClick={()=>setView("search")}>검색</button>
            {isAdmin
              ?<div style={{display:"flex",gap:5,alignItems:"center"}}>
                <div className="adm-badge" onClick={()=>setIsAdmin(false)}>⚙ Admin</div>
                <button className="nav-btn nav-i" onClick={()=>setShowCP(true)}>PIN</button>
              </div>
              :<button className="nav-btn nav-i" onClick={()=>setShowPin(true)}>🔒 관리자</button>
            }
          </div>
        </div>
      </div>

      {/* 약도 */}
      {view==="map"&&(
        <div className="ct">
          <div className="hint">Floor plan — 선반을 클릭하면 기자재 목록을 볼 수 있어요</div>
          <div className="map-wrap"><LabMap shelves={shelves} onSelect={id=>{setSelId(id);setView("shelf");}} selectedId={selId}/></div>
          <div className="sg">
            {shelves.map(sh=>{
              const t=sh.floors.reduce((a,f)=>a+f.items.length,0);
              return<div key={sh.id} className="st" onClick={()=>{setSelId(sh.id);setView("shelf");}}><div className="st-n">{sh.name}</div><div className="st-s">{sh.floors.length}층 · {t}종</div></div>;
            })}
          </div>
        </div>
      )}

      {/* 검색 */}
      {view==="search"&&(
        <div className="ct">
          <input value={searchQ} onChange={e=>setSearchQ(e.target.value)} placeholder="🔍  기자재 이름으로 검색…" className="inp" style={{marginBottom:15,fontSize:14}} autoFocus/>
          {searchQ&&searchResults.length===0&&<div className="epty"><div style={{fontSize:32,marginBottom:10}}>🌿</div>검색 결과가 없어요</div>}
          {searchResults.map(({it,fl,sh})=>(
            <div key={it.id} onClick={()=>{setSelId(sh.id);setView("shelf");}} className="card" style={{display:"flex",alignItems:"center",gap:13,cursor:"pointer"}}>
              <div style={{width:11,height:11,borderRadius:2,background:it.color||"#2D3561",flexShrink:0}}/>
              <div style={{flex:1}}>
                <div style={{fontWeight:600,fontSize:14,color:"#2D3561",marginBottom:4}}>{it.name}</div>
                <div style={{fontSize:11,color:"#8C8070",display:"flex",gap:6,alignItems:"center",flexWrap:"wrap"}}>
                  <span className="tag" style={{background:"#2D356112",color:"#2D3561"}}>{sh.name}</span>
                  <span>{fl.label}</span>
                  {it.qty!=null&&<span>수량 {it.qty}</span>}
                  {it.status&&<span className="tag" style={{background:STATUS_OPTIONS.find(s=>s.value===it.status)?.color+"15",color:STATUS_OPTIONS.find(s=>s.value===it.status)?.color}}>{it.status}</span>}
                </div>
              </div>
              <div style={{color:"#C0B8A8",fontSize:18}}>›</div>
            </div>
          ))}
          {!searchQ&&<div className="epty"><div style={{fontSize:34,marginBottom:10}}>🔬</div>기자재 이름을 입력해 위치를 찾아보세요</div>}
        </div>
      )}

      {/* 선반 상세 */}
      {view==="shelf"&&currentShelf&&(
        <div className="ct">
          <div style={{display:"flex",alignItems:"center",gap:9,marginBottom:16,flexWrap:"wrap"}}>
            <button onClick={()=>{setView("map");setSelId(null);}} className="bs">← 약도</button>
            {renaming===currentShelf.id?(
              <div style={{display:"flex",gap:6,alignItems:"center",flex:1}}>
                <input value={renameText} onChange={e=>setRenameText(e.target.value)} onKeyDown={e=>e.key==="Enter"&&renameShelf(currentShelf.id)} className="inp" style={{flex:1}} autoFocus/>
                <button onClick={()=>renameShelf(currentShelf.id)} className="bp">저장</button>
                <button onClick={()=>setRenaming(null)} className="bs">취소</button>
              </div>
            ):(
              <div style={{display:"flex",alignItems:"center",gap:8,flex:1,flexWrap:"wrap"}}>
                <span style={{fontFamily:"'Playfair Display',serif",fontWeight:600,fontSize:18,color:"#2D3561"}}>{currentShelf.name}</span>
                <span style={{fontSize:11,color:"#8C8070",fontStyle:"italic"}}>{currentShelf.floors.length}층 구조</span>
                {isAdmin&&<><button onClick={()=>{setRenaming(currentShelf.id);setRenameText(currentShelf.name);}} className="bg">✏ 이름</button><button onClick={()=>deleteShelf(currentShelf.id)} className="bd">🗑 삭제</button></>}
              </div>
            )}
          </div>
          <div style={{background:"#FDFAF3",borderRadius:14,border:"1px solid #D4CCBB",overflow:"hidden",marginBottom:18,boxShadow:"0 2px 12px rgba(45,53,97,.06)"}}>
            <ShelfFrontView shelf={currentShelf}/>
          </div>
          {currentShelf.floors.map(floor=>(
            <div key={floor.id} className="card" style={{borderLeft:"3px solid #2D3561",marginBottom:13}}>
              <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:11}}>
                <div style={{display:"flex",alignItems:"center",gap:8}}>
                  <div className="fnum">{floor.label.replace("층","")}</div>
                  <span style={{fontWeight:600,fontSize:14,color:"#2D3561"}}>{floor.label}</span>
                  <span className="tag" style={{background:"#2D356112",color:"#2D3561"}}>{floor.items.length}종</span>
                </div>
                {isAdmin&&<button onClick={()=>openAddItem(currentShelf.id,floor.id)} className="bp">+ 등록</button>}
              </div>
              {floor.items.length===0?(
                <div style={{padding:"15px 0",textAlign:"center",color:"#B0A890",fontSize:11,border:"1px dashed #D4CCBB",borderRadius:9,fontStyle:"italic",fontFamily:"'Playfair Display',serif"}}>
                  {isAdmin?"+ 등록 버튼으로 기자재를 추가하세요":"아직 등록된 기자재가 없어요"}
                </div>
              ):(
                <div style={{display:"flex",flexDirection:"column",gap:6}}>
                  {floor.items.map(item=>{
                    const stOpt=STATUS_OPTIONS.find(s=>s.value===item.status)||STATUS_OPTIONS[0];
                    return(
                      <div key={item.id} className="icard">
                        <div style={{display:"flex",alignItems:"center",gap:9}}>
                          <div style={{width:9,height:9,borderRadius:2,background:item.color||"#2D3561",flexShrink:0}}/>
                          <span style={{flex:1,fontSize:13,color:"#2D3561",fontWeight:600}}>{item.name}</span>
                          {isAdmin&&<div style={{display:"flex",gap:4,flexShrink:0}}><button onClick={()=>openEditItem(currentShelf.id,floor.id,item)} className="bg">✏</button><button onClick={()=>deleteItem(currentShelf.id,floor.id,item.id)} className="bd">🗑</button></div>}
                        </div>
                        <div style={{display:"flex",gap:9,marginTop:6,flexWrap:"wrap",alignItems:"center"}}>
                          {item.qty!=null&&<div style={{display:"flex",alignItems:"center",gap:3}}><span style={{fontSize:10,color:"#8C8070"}}>수량</span><span style={{fontSize:12,fontWeight:700,color:"#2D3561",background:"#FDFAF3",border:"1px solid #D4CCBB",borderRadius:5,padding:"1px 7px"}}>{item.qty}</span></div>}
                          <div style={{display:"flex",alignItems:"center",gap:3}}><span className="sdot" style={{background:stOpt.color}}/><span style={{fontSize:11,color:stOpt.color,fontWeight:600}}>{item.status||"정상"}</span></div>
                        </div>
                        {item.memo&&<div style={{marginTop:6,fontSize:11,color:"#6B6358",background:"#F0EBE0",border:"1px solid #DDD5C5",borderRadius:7,padding:"6px 9px",lineHeight:1.6,fontStyle:"italic"}}>📝 {item.memo}</div>}
                      </div>
                    );
                  })}
                </div>
              )}
            </div>
          ))}
        </div>
      )}
      <div style={{height:48}}/>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
