<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Biology Lab</title>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600&family=Noto+Serif+KR:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;}
html,body{background:#F0EDE6;font-family:'Noto Serif KR',sans-serif;min-height:100vh;color:#2D3561;}
body::before{content:'';position:fixed;inset:0;background:url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='%23C0B8AC' fill-opacity='0.12'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/svg%3E");pointer-events:none;z-index:0;}
#root{position:relative;z-index:1;}

.hdr{background:linear-gradient(135deg,#2D3561,#1a2040);position:sticky;top:0;z-index:50;box-shadow:0 4px 20px rgba(0,0,0,.2);}
.hdr-in{max-width:760px;margin:0 auto;padding:12px 16px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;}
.logo{display:flex;align-items:center;gap:8px;}
.logo-ic{width:36px;height:36px;border-radius:9px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.18);display:flex;align-items:center;justify-content:center;font-size:18px;}
.logo-t{font-family:'Playfair Display',serif;font-size:14px;font-weight:600;color:#EEE8D8;letter-spacing:.3px;}
.logo-s{font-size:8px;color:rgba(238,232,216,.4);margin-top:1px;}
.nav{display:flex;gap:5px;align-items:center;flex-wrap:wrap;}
.btn-nav{padding:5px 12px;border-radius:16px;border:1px solid rgba(255,255,255,.18);cursor:pointer;font-size:11px;transition:all .2s;color:rgba(238,232,216,.55);background:transparent;font-family:'Noto Serif KR',sans-serif;}
.btn-nav.act{background:rgba(255,255,255,.2);color:#EEE8D8;}
.sync{padding:3px 9px;border-radius:16px;font-size:9px;font-weight:600;border:1px solid;background:#2D356108;color:#2D3561;border-color:#2D356125;}
.sync.on{background:rgba(74,222,128,.1);color:#4ADE80;border-color:rgba(74,222,128,.22);}

.ct{padding:16px;max-width:740px;margin:0 auto;}
.hint{font-size:10px;color:#8C8070;font-style:italic;font-family:'Playfair Display',serif;margin-bottom:10px;letter-spacing:.3px;}
.card{background:#FDFAF3;border-radius:11px;border:1px solid #D4CCBB;padding:12px 14px;margin-bottom:8px;box-shadow:0 1px 4px rgba(0,0,0,.03);}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:7px;}
.tile{background:#FDFAF3;border-radius:9px;border:1px solid #D4CCBB;border-left:3px solid #2D3561;padding:9px 11px;cursor:pointer;transition:all .15s;}
.tile:hover{transform:translateY(-1px);box-shadow:0 3px 10px rgba(45,53,97,.08);}
.tile-n{font-size:11px;font-weight:600;color:#2D3561;margin-bottom:2px;}
.tile-s{font-size:9px;color:#8C8070;}
.icard{background:#F5F0E8;border-radius:8px;border:1px solid #DDD5C5;padding:8px 10px;margin-bottom:5px;}

.btn{border:none;cursor:pointer;font-family:'Noto Serif KR',sans-serif;border-radius:7px;transition:all .15s;font-size:10px;}
.btn-p{padding:6px 14px;background:#2D3561;color:#EEE8D8;font-weight:600;}
.btn-p:hover{background:#3D4571;}
.btn-s{padding:6px 11px;background:#FDFAF3;color:#5C5448;border:1px solid #C8C0B0;font-weight:600;}
.btn-g{padding:3px 8px;background:#FDFAF3;color:#6B6358;border:1px solid #C8C0B0;}
.btn-d{padding:3px 8px;background:#FDF2F2;color:#B83232;border:1px solid #F0C0C0;}

.inp{padding:7px 10px;border-radius:7px;border:1px solid #C8C0B0;background:#FDFAF3;color:#2D3561;font-size:11px;font-family:'Noto Serif KR',sans-serif;outline:none;width:100%;}
.inp:focus{border-color:#2D3561;box-shadow:0 0 0 2px rgba(45,53,97,.05);}
.lbl{font-size:9px;font-weight:600;color:#6B6358;margin-bottom:3px;display:block;}

.modal-bg{position:fixed;inset:0;background:rgba(20,18,32,.4);display:flex;align-items:center;justify-content:center;z-index:200;backdrop-filter:blur(3px);}
.modal{background:#FDFAF3;border-radius:14px;padding:20px;width:300px;max-width:92vw;box-shadow:0 20px 40px rgba(20,18,32,.2);border:1px solid #D4CCBB;}
.modal-t{font-family:'Playfair Display',serif;font-size:15px;font-weight:600;color:#2D3561;margin-bottom:12px;}

.loading{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;color:#8C8070;}
.loading-ic{font-size:28px;}
.loading-t{font-family:'Playfair Display',serif;font-style:italic;font-size:13px;}

.toast{position:fixed;top:12px;left:50%;transform:translateX(-50%);padding:7px 16px;border-radius:99px;font-size:10px;font-weight:600;z-index:9999;pointer-events:none;white-space:nowrap;box-shadow:0 4px 16px rgba(0,0,0,.12);}
.toast.ok{background:#2D3561;color:#EEE8D8;}
.empty{text-align:center;padding:40px 16px;color:#8C8070;font-style:italic;font-family:'Playfair Display',serif;font-size:10px;}
.tag{display:inline-block;padding:2px 7px;border-radius:99px;font-size:8px;font-weight:600;}
</style>
</head>
<body>
<div id="root"></div>

<script>
try {
  firebase.initializeApp({
    apiKey: "AIzaSyAAKEXvF9ckBxPkHsg9Nl021sb7EFAR40Q",
    authDomain: "bio-let-a1691.firebaseapp.com",
    databaseURL: "https://bio-let-a1691-default-rtdb.firebaseio.com",
    projectId: "bio-let-a1691",
    storageBucket: "bio-let-a1691.firebasestorage.app",
    messagingSenderId: "816068959265",
    appId: "1:816068959265:web:5de48f1bc5899407dbd760"
  });
} catch(e) {
  console.error("Firebase init error:", e);
}

const db = firebase.database();

let state = {
  shelves: [
    {id:"L1",name:"왼쪽 선반 1",color:"#2D3561",floors:[{id:"L1-f1",label:"1층",items:[]},{id:"L1-f2",label:"2층",items:[]}]},
    {id:"L2",name:"왼쪽 선반 2",color:"#2D3561",floors:[{id:"L2-f1",label:"1층",items:[]},{id:"L2-f2",label:"2층",items:[]}]},
    {id:"L3",name:"왼쪽 선반 3",color:"#2D3561",floors:[{id:"L3-f1",label:"1층",items:[]},{id:"L3-f2",label:"2층",items:[]}]},
    {id:"L4",name:"왼쪽 선반 4",color:"#2D3561",floors:[{id:"L4-f1",label:"1층",items:[]},{id:"L4-f2",label:"2층",items:[]}]},
    {id:"L5",name:"왼쪽 선반 5",color:"#2D3561",floors:[{id:"L5-f1",label:"1층",items:[]},{id:"L5-f2",label:"2층",items:[]}]},
    {id:"L6",name:"왼쪽 선반 6",color:"#2D3561",floors:[{id:"L6-f1",label:"1층",items:[]},{id:"L6-f2",label:"2층",items:[]}]},
    {id:"drug",name:"약품보관장",color:"#2D3561",floors:[{id:"drug-f1",label:"1층",items:[]},{id:"drug-f2",label:"2층",items:[]}]},
    {id:"R1",name:"오른쪽 선반",color:"#2D3561",floors:[{id:"R1-f1",label:"1층",items:[]}]},
  ],
  adminPin: "1234",
  view: "map",
  selectedId: null,
  isAdmin: false,
  showPin: false,
  showCP: false,
  itemForm: null,
  toast: null,
  synced: false,
  loaded: false,
};

function save() {
  try {
    db.ref("biolab").set({shelves: state.shelves, adminPin: state.adminPin}).catch(e => console.error("Save error:", e));
  } catch(e) {
    console.error("Save exception:", e);
  }
}

function showToast(msg, t = "ok") {
  state.toast = {msg, t};
  render();
  setTimeout(() => {
    state.toast = null;
    render();
  }, 2000);
}

function genId() {
  return Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
}

function updateShelf(fn) {
  try {
    state.shelves = fn(state.shelves);
    save();
    render();
  } catch(e) {
    console.error("Update error:", e);
  }
}

function render() {
  const r = document.getElementById("root");
  if (!state.loaded) {
    r.innerHTML = '<div class="loading"><div class="loading-ic">🔬</div><div class="loading-t">Biology Lab</div><div style="font-size:10px;">데이터 불러오는 중…</div></div>';
    return;
  }

  let html = '<div class="hdr"><div class="hdr-in"><div class="logo"><div class="logo-ic">🔬</div><div><div class="logo-t">Biology Lab</div><div class="logo-s">SPECIMEN</div></div></div><div class="nav">';
  html += `<div class="sync ${state.synced ? 'on' : ''}">${state.synced ? '● live' : '○ con'}</div>`;
  html += `<button class="btn-nav ${state.view === 'map' ? 'act' : ''}" onclick="w.setState({view:'map',selectedId:null});">약도</button>`;
  html += `<button class="btn-nav ${state.view === 'search' ? 'act' : ''}" onclick="w.setState({view:'search'});">검색</button>`;
  if (state.isAdmin) {
    html += `<div style="display:flex;gap:4px;align-items:center;"><span style="padding:3px 8px;border-radius:16px;background:rgba(212,175,55,.14);color:#D4AF37;border:1px solid rgba(212,175,55,.3);font-size:9px;font-weight:600;cursor:pointer;" onclick="w.setState({isAdmin:false});">⚙</span><button class="btn-nav" onclick="w.setState({showCP:true});">PIN</button></div>`;
  } else {
    html += `<button class="btn-nav" onclick="w.setState({showPin:true});">🔒</button>`;
  }
  html += '</div></div></div>';

  html += '<div class="ct">';
  
  if (state.view === 'map') {
    html += '<div class="hint">Floor plan</div>';
    html += '<div class="grid">';
    for (let sh of state.shelves) {
      let t = sh.floors.reduce((a, f) => a + f.items.length, 0);
      html += `<div class="tile" onclick="w.setState({selectedId:'${sh.id}',view:'shelf'})"><div class="tile-n">${sh.name}</div><div class="tile-s">${sh.floors.length}층 · ${t}종</div></div>`;
    }
    html += '</div>';
  } else if (state.view === 'search') {
    let q = (document.querySelector('[data-q]')?.value || '').toLowerCase();
    html += `<input class="inp" data-q style="margin-bottom:10px;" placeholder="🔍 검색…" onkeyup="w.render();"/>`;
    let res = [];
    if (q) {
      for (let sh of state.shelves) {
        for (let f of sh.floors) {
          for (let it of f.items) {
            if (it.name.toLowerCase().includes(q)) res.push({it, f, sh});
          }
        }
      }
    }
    if (q && res.length === 0) html += '<div class="empty">검색 결과 없음</div>';
    else if (!q) html += '<div class="empty">이름 입력</div>';
    else {
      for (let {it, f, sh} of res) {
        html += `<div class="card" style="display:flex;align-items:center;gap:10px;cursor:pointer;" onclick="w.setState({selectedId:'${sh.id}',view:'shelf'})"><div style="width:9px;height:9px;border-radius:2px;background:${it.color||'#2D3561'};flex-shrink:0;"/><div style="flex:1;"><div style="font-weight:600;font-size:12px;margin-bottom:2px;">${it.name}</div><div style="font-size:9px;color:#8C8070;"><span class="tag" style="background:#2D356112;color:#2D3561;">${sh.name}</span> ${f.label}</div></div></div>`;
      }
    }
  } else if (state.view === 'shelf' && state.selectedId) {
    let sh = state.shelves.find(s => s.id === state.selectedId);
    if (sh) {
      html += `<div style="display:flex;align-items:center;gap:6px;margin-bottom:12px;flex-wrap:wrap;"><button class="btn-s" onclick="w.setState({view:'map',selectedId:null});">← 약도</button><span style="font-family:'Playfair Display',serif;font-weight:600;font-size:15px;">${sh.name}</span></div>`;
      
      for (let f of sh.floors) {
        html += `<div class="card" style="border-left:3px solid #2D3561;"><div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;"><div style="display:flex;align-items:center;gap:6px;"><div style="width:22px;height:22px;border-radius:5px;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:700;background:#2D356110;color:#2D3561;">${f.label.replace('층','')}</div><span style="font-weight:600;font-size:12px;">${f.label}</span><span class="tag" style="background:#2D356112;color:#2D3561;">${f.items.length}</span></div>${state.isAdmin ? `<button class="btn-p" onclick="w.newItem('${sh.id}','${f.id}');">+</button>` : ''}</div>`;
        
        if (f.items.length === 0) {
          html += `<div style="padding:10px 0;text-align:center;color:#B0A890;font-size:9px;border:1px dashed #D4CCBB;border-radius:6px;font-style:italic;font-family:'Playfair Display',serif;">${state.isAdmin ? '+ 추가' : '없음'}</div>`;
        } else {
          for (let it of f.items) {
            let col = {정상:'#1E7A44',부족:'#C85A1A',점검필요:'#B83232',없음:'#94A3B8'};
            html += `<div class="icard"><div style="display:flex;align-items:center;gap:7px;"><div style="width:7px;height:7px;border-radius:2px;background:${it.color||'#2D3561'};flex-shrink:0;"/><span style="flex:1;font-size:11px;font-weight:600;">${it.name}</span>${state.isAdmin ? `<button class="btn-g" onclick="w.editItem('${sh.id}','${f.id}','${it.id}');">✏</button><button class="btn-d" onclick="w.delItem('${sh.id}','${f.id}','${it.id}');">🗑</button>` : ''}</div><div style="display:flex;gap:6px;margin-top:5px;align-items:center;flex-wrap:wrap;font-size:9px;"><span style="color:#8C8070;">수량</span><span style="font-weight:700;color:#2D3561;background:#FDFAF3;border:1px solid #D4CCBB;border-radius:3px;padding:0 5px;">${it.qty}</span><span style="color:${col[it.status]||'#2D3561'};font-weight:600;">${it.status}</span></div>${it.memo ? `<div style="margin-top:5px;font-size:9px;color:#6B6358;background:#F0EBE0;border:1px solid #DDD5C5;border-radius:5px;padding:4px 7px;font-style:italic;">📝 ${it.memo}</div>` : ''}</div>`;
          }
        }
        html += '</div>';
      }
    }
  }
  html += '</div>';

  if (state.showPin) {
    html += `<div class="modal-bg" onclick="if(event.target===this)w.setState({showPin:false});"><div class="modal" onclick="event.stopPropagation();"><div class="modal-t">관리자</div><input type="password" id="pin" class="inp" style="letter-spacing:4px;text-align:center;margin-bottom:8px;" placeholder="••••" autofocus/><div id="pinErr" style="color:#B83232;font-size:9px;margin-bottom:6px;text-align:center;display:none;">오류</div><div style="display:flex;gap:6px;"><button class="btn-p" style="flex:1;" onclick="w.tryLogin()">확인</button><button class="btn-s" style="flex:1;" onclick="w.setState({showPin:false});">취소</button></div></div></div>`;
  }
  
  if (state.showCP) {
    html += `<div class="modal-bg" onclick="if(event.target===this)w.setState({showCP:false});"><div class="modal" onclick="event.stopPropagation();"><div class="modal-t">PIN 변경</div><label class="lbl">현재</label><input type="password" id="old" class="inp" style="letter-spacing:3px;text-align:center;margin-bottom:8px;"/><label class="lbl">새 PIN</label><input type="password" id="new" class="inp" style="letter-spacing:3px;text-align:center;margin-bottom:8px;"/><label class="lbl">확인</label><input type="password" id="new2" class="inp" style="letter-spacing:3px;text-align:center;margin-bottom:8px;"/><div id="cpErr" style="color:#B83232;font-size:9px;margin-bottom:6px;text-align:center;display:none;"></div><div style="display:flex;gap:6px;"><button class="btn-p" style="flex:1;" onclick="w.tryChangePin()">변경</button><button class="btn-s" style="flex:1;" onclick="w.setState({showCP:false});">취소</button></div></div></div>`;
  }

  if (state.itemForm) {
    let it = state.itemForm.item || {};
    let cols = ['#94A3B8','#B83232','#C85A1A','#A08010','#1E7A44','#2D3561','#622C82','#7A4A1E'];
    html += `<div class="modal-bg" onclick="if(event.target===this)w.setState({itemForm:null});"><div class="modal" onclick="event.stopPropagation();"><div class="modal-t">${state.itemForm.mode==='add'?'등록':'수정'}</div><label class="lbl">이름</label><input type="text" id="iname" class="inp" value="${it.name||''}" placeholder="비커…" style="margin-bottom:8px;" autofocus/><div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px;"><div><label class="lbl">수량</label><div style="display:flex;align-items:center;gap:3px;"><button class="btn-g" onclick="w.chQty(-1)">−</button><input type="number" id="iqty" class="inp" value="${it.qty||1}" style="text-align:center;padding:5px 3px;"/><button class="btn-g" onclick="w.chQty(1)">＋</button></div></div><div><label class="lbl">상태</label><select id="istat" class="inp" style="padding:5px 7px;cursor:pointer;"><option>정상</option><option>부족</option><option>점검필요</option><option>없음</option></select></div></div><label class="lbl">색상</label><div style="display:flex;gap:5px;flex-wrap:wrap;margin-bottom:8px;">${cols.map(c=>`<button style="width:18px;height:18px;border-radius:99px;border:${it.color===c?'2px':'2px'} solid ${it.color===c?'#2D3561':'transparent'};background:${c};cursor:pointer;padding:0;" onclick="document.getElementById('icol').value='${c}';w.render();"/>`).join('')}</div><input type="hidden" id="icol" value="${it.color||'#2D3561'}"/><label class="lbl">메모</label><textarea id="imemo" class="inp" style="resize:vertical;min-height:40px;margin-bottom:8px;font-family:'Noto Serif KR',sans-serif;" placeholder="위치…">${it.memo||''}</textarea><div style="display:flex;gap:6px;"><button class="btn-p" style="flex:1;" onclick="w.saveItem()">저장</button><button class="btn-s" style="flex:1;" onclick="w.setState({itemForm:null});">취소</button></div></div></div>`;
  }

  if (state.toast) html += `<div class="toast ${state.toast.t}">${state.toast.msg}</div>`;
  
  r.innerHTML = html;
}

const w = {
  setState: (updates) => { Object.assign(state, updates); render(); },
  render: () => render(),
  tryLogin: () => {
    let p = document.getElementById('pin').value;
    if (p === state.adminPin) {
      state.isAdmin = true;
      state.showPin = false;
      showToast('관리자');
    } else {
      document.getElementById('pinErr').style.display = 'block';
      document.getElementById('pin').value = '';
    }
  },
  tryChangePin: () => {
    let o = document.getElementById('old').value, n = document.getElementById('new').value, n2 = document.getElementById('new2').value;
    if (o !== state.adminPin) { document.getElementById('cpErr').textContent = 'PIN 오류'; document.getElementById('cpErr').style.display = 'block'; return; }
    if (n.length < 4) { document.getElementById('cpErr').textContent = '4자리'; document.getElementById('cpErr').style.display = 'block'; return; }
    if (n !== n2) { document.getElementById('cpErr').textContent = '불일치'; document.getElementById('cpErr').style.display = 'block'; return; }
    state.adminPin = n;
    state.showCP = false;
    save();
    showToast('변경');
  },
  newItem: (sid, fid) => { state.itemForm = {mode:'add', shelfId:sid, floorId:fid, item:{name:'',qty:1,status:'정상',color:'#2D3561',memo:''}, itemId:null}; render(); },
  editItem: (sid, fid, iid) => {
    let sh = state.shelves.find(s => s.id === sid), f = sh.floors.find(f => f.id === fid), it = f.items.find(i => i.id === iid);
    state.itemForm = {mode:'edit', shelfId:sid, floorId:fid, item:{...it}, itemId:iid};
    render();
  },
  saveItem: () => {
    let n = document.getElementById('iname').value.trim();
    if (!n) return;
    let it = {id:state.itemForm.itemId||genId(), name:n, qty:parseInt(document.getElementById('iqty').value)||1, status:document.getElementById('istat').value, color:document.getElementById('icol').value, memo:document.getElementById('imemo').value.trim()};
    updateShelf(ss => {
      let sh = ss.find(s => s.id === state.itemForm.shelfId), f = sh.floors.find(f => f.id === state.itemForm.floorId);
      if (state.itemForm.mode === 'edit') {
        let idx = f.items.findIndex(i => i.id === state.itemForm.itemId);
        if (idx !== -1) f.items[idx] = it;
      } else f.items.push(it);
      return ss;
    });
    state.itemForm = null;
    showToast('저장');
  },
  delItem: (sid, fid, iid) => {
    updateShelf(ss => {
      let sh = ss.find(s => s.id === sid), f = sh.floors.find(f => f.id === fid);
      f.items = f.items.filter(i => i.id !== iid);
      return ss;
    });
    showToast('삭제');
  },
  chQty: (d) => { let q = parseInt(document.getElementById('iqty').value)||1; document.getElementById('iqty').value = Math.max(0,q+d); }
};

db.ref("biolab").on("value", snap => {
  try {
    let d = snap.val();
    if (d) {
      if (d.shelves) state.shelves = d.shelves;
      if (d.adminPin) state.adminPin = d.adminPin;
      state.synced = true;
    }
    state.loaded = true;
    render();
  } catch(e) {
    console.error("Snapshot error:", e);
    state.loaded = true;
    render();
  }
}, (err) => {
  console.error("DB error:", err);
  state.loaded = true;
  render();
});

window.w = w;
render();
</script>
</body>
