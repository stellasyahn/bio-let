<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Biology Lab</title>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600&family=Noto+Serif+KR:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;}
html,body{background:#F0EDE6;font-family:'Noto Serif KR',sans-serif;min-height:100vh;}
body::before{content:'';position:fixed;inset:0;background:url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='%23C0B8AC' fill-opacity='0.12'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/svg%3E");pointer-events:none;z-index:0;}
#root{position:relative;z-index:1;}
.hdr{background:linear-gradient(135deg,#2D3561,#1a2040);position:sticky;top:0;z-index:50;box-shadow:0 4px 20px rgba(0,0,0,.2);}
.hdr-in{max-width:760px;margin:0 auto;padding:14px 20px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;}
.logo{display:flex;align-items:center;gap:10px;}
.logo-ic{width:38px;height:38px;border-radius:10px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.18);display:flex;align-items:center;justify-content:center;font-size:20px;}
.logo-t{font-family:'Playfair Display',serif;font-size:15px;font-weight:600;color:#EEE8D8;}
.logo-s{font-size:9px;color:rgba(238,232,216,.45);margin-top:1px;}
.nav{display:flex;gap:6px;align-items:center;flex-wrap:wrap;}
.btn-nav{padding:6px 14px;border-radius:18px;border:1px solid rgba(255,255,255,.18);cursor:pointer;font-size:12px;transition:all .2s;color:rgba(238,232,216,.55);background:transparent;}
.btn-nav.act{background:rgba(255,255,255,.2);color:#EEE8D8;}
.btn-nav:hover{background:rgba(255,255,255,.18);color:#EEE8D8;}
.sync{padding:4px 10px;border-radius:18px;font-size:10px;font-weight:600;border:1px solid;background:#2D356108;color:#2D3561;border-color:#2D356125;}
.sync.on{background:rgba(74,222,128,.1);color:#4ADE80;border-color:rgba(74,222,128,.22);}

.ct{padding:20px 16px;max-width:740px;margin:0 auto;}
.hint{font-size:11px;color:#8C8070;font-style:italic;font-family:'Playfair Display',serif;margin-bottom:12px;}
.map{background:#FDFAF3;border-radius:14px;border:1px solid #D4CCBB;overflow:hidden;margin-bottom:16px;box-shadow:0 3px 16px rgba(45,53,97,.08);}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px;}
.tile{background:#FDFAF3;border-radius:11px;border:1px solid #D4CCBB;border-left:3px solid #2D3561;padding:10px 12px;cursor:pointer;transition:all .15s;}
.tile:hover{transform:translateY(-1px);box-shadow:0 3px 12px rgba(45,53,97,.1);}
.tile-n{font-size:12px;font-weight:600;color:#2D3561;margin-bottom:2px;}
.tile-s{font-size:10px;color:#8C8070;}
.card{background:#FDFAF3;border-radius:12px;border:1px solid #D4CCBB;padding:14px 16px;margin-bottom:10px;}
.icard{background:#F5F0E8;border-radius:8px;border:1px solid #DDD5C5;padding:9px 11px;margin-bottom:6px;}
.btn{border:none;cursor:pointer;font-size:11px;font-family:'Noto Serif KR',sans-serif;border-radius:8px;transition:all .15s;}
.btn-p{padding:7px 16px;background:#2D3561;color:#EEE8D8;font-weight:600;}
.btn-p:hover{background:#3D4571;}
.btn-s{padding:7px 12px;background:#FDFAF3;color:#5C5448;border:1px solid #C8C0B0;font-weight:600;}
.btn-g{padding:4px 10px;background:#FDFAF3;color:#6B6358;border:1px solid #C8C0B0;}
.btn-d{padding:4px 10px;background:#FDF2F2;color:#B83232;border:1px solid #F0C0C0;}
.btn-add{width:100%;padding:7px;border:1.5px dashed #C8C0B0;background:transparent;border-radius:8px;cursor:pointer;font-size:11px;color:#8C8070;font-family:'Noto Serif KR',sans-serif;display:flex;align-items:center;justify-content:center;gap:5px;}
.btn-add:hover{background:#F0EBE0;border-color:#9B9BB4;}
.inp{padding:8px 12px;border-radius:8px;border:1px solid #C8C0B0;background:#FDFAF3;color:#2D3561;font-size:12px;font-family:'Noto Serif KR',sans-serif;outline:none;width:100%;}
.inp:focus{border-color:#2D3561;box-shadow:0 0 0 3px rgba(45,53,97,.06);}
.lbl{font-size:10px;font-weight:600;color:#6B6358;margin-bottom:4px;display:block;}
.tag{display:inline-block;padding:2px 8px;border-radius:99px;font-size:9px;font-weight:600;}
.modal-bg{position:fixed;inset:0;background:rgba(20,18,32,.4);display:flex;align-items:center;justify-content:center;z-index:200;backdrop-filter:blur(4px);}
.modal{background:#FDFAF3;border-radius:16px;padding:24px;width:320px;max-width:92vw;box-shadow:0 20px 50px rgba(20,18,32,.2);border:1px solid #D4CCBB;}
.modal-t{font-family:'Playfair Display',serif;font-size:16px;font-weight:600;color:#2D3561;margin-bottom:14px;}
.loading{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;color:#8C8070;}
.loading-ic{font-size:32px;}
.toast{position:fixed;top:14px;left:50%;transform:translateX(-50%);padding:8px 18px;border-radius:99px;font-size:11px;font-weight:600;z-index:9999;pointer-events:none;white-space:nowrap;box-shadow:0 6px 20px rgba(0,0,0,.12);}
.toast.ok{background:#2D3561;color:#EEE8D8;}
.toast.info{background:#6B6358;color:#F2EDE3;}
.empty{text-align:center;padding:50px 20px;color:#8C8070;font-style:italic;font-family:'Playfair Display',serif;}
</style>
</head>
<body>
<div id="root"></div>

<script>
firebase.initializeApp({
  apiKey:"AIzaSyAAKEXvF9ckBxPkHsg9Nl021sb7EFAR40Q",
  authDomain:"bio-let-a1691.firebaseapp.com",
  databaseURL:"https://bio-let-a1691-default-rtdb.firebaseio.com",
  projectId:"bio-let-a1691",
  storageBucket:"bio-let-a1691.firebasestorage.app",
  messagingSenderId:"816068959265",
  appId:"1:816068959265:web:5de48f1bc5899407dbd760"
});
const db=firebase.database();

let state={
  shelves:[
    {id:"L1",name:"왼쪽 선반 1",color:"#2D3561",floors:[{id:"L1-f1",label:"1층",items:[]},{id:"L1-f2",label:"2층",items:[]}]},
    {id:"L2",name:"왼쪽 선반 2",color:"#2D3561",floors:[{id:"L2-f1",label:"1층",items:[]},{id:"L2-f2",label:"2층",items:[]}]},
    {id:"L3",name:"왼쪽 선반 3",color:"#2D3561",floors:[{id:"L3-f1",label:"1층",items:[]},{id:"L3-f2",label:"2층",items:[]}]},
    {id:"L4",name:"왼쪽 선반 4",color:"#2D3561",floors:[{id:"L4-f1",label:"1층",items:[]},{id:"L4-f2",label:"2층",items:[]}]},
    {id:"L5",name:"왼쪽 선반 5",color:"#2D3561",floors:[{id:"L5-f1",label:"1층",items:[]},{id:"L5-f2",label:"2층",items:[]}]},
    {id:"L6",name:"왼쪽 선반 6",color:"#2D3561",floors:[{id:"L6-f1",label:"1층",items:[]},{id:"L6-f2",label:"2층",items:[]}]},
    {id:"drug",name:"약품보관장",color:"#2D3561",floors:[{id:"drug-f1",label:"1층",items:[]},{id:"drug-f2",label:"2층",items:[]}]},
    {id:"R1",name:"오른쪽 선반",color:"#2D3561",floors:[{id:"R1-f1",label:"1층",items:[]}]},
  ],
  adminPin:"1234",
  view:"map",
  selectedId:null,
  isAdmin:false,
  showPin:false,
  showCP:false,
  itemForm:null,
  toast:null,
  synced:false,
  loaded:false,
};

function save(){db.ref("biolab").set({shelves:state.shelves,adminPin:state.adminPin}).catch(()=>{});}
function showToast(msg,t="ok"){state.toast={msg,t};render();setTimeout(()=>{state.toast=null;render();},2200);}
function genId(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6);}
function updateShelf(fn){state.shelves=fn(state.shelves);save();render();}

function render(){
  const r=document.getElementById("root");
  if(!state.loaded){r.innerHTML='<div class="loading"><div class="loading-ic">🔬</div><div style="font-family:\'Playfair Display\',serif;font-style:italic;font-size:15px;">Biology Lab</div><div>데이터 불러오는 중…</div></div>';return;}

  let html='<div class="hdr"><div class="hdr-in"><div class="logo"><div class="logo-ic">🔬</div><div><div class="logo-t">Biology Lab</div><div class="logo-s">SPECIMEN REGISTRY</div></div></div><div class="nav">';
  html+=`<div class="sync ${state.synced?'on':''}">${state.synced?'● live':'○ 연결중'}</div>`;
  html+=`<button class="btn-nav ${state.view==='map'?'act':''}" onclick="state.view='map';state.selectedId=null;render();">약도</button>`;
  html+=`<button class="btn-nav ${state.view==='search'?'act':''}" onclick="state.view='search';render();">검색</button>`;
  if(state.isAdmin) html+=`<div style="display:flex;gap:5px;align-items:center;"><span style="padding:4px 10px;border-radius:18px;background:rgba(212,175,55,.14);color:#D4AF37;border:1px solid rgba(212,175,55,.3);font-size:10px;font-weight:600;cursor:pointer;" onclick="state.isAdmin=false;render();">⚙ Admin</span><button class="btn-nav" onclick="state.showCP=true;render();">PIN</button></div>`;
  else html+=`<button class="btn-nav" onclick="state.showPin=true;render();">🔒 관리자</button>`;
  html+='</div></div></div>';

  html+='<div class="ct">';
  if(state.view==='map'){
    html+='<div class="hint">Floor plan — 선반을 클릭하면 기자재를 확인할 수 있어요</div>';
    html+='<div class="map"><svg viewBox="0 0 500 420" style="width:100%;display:block;max-height:450px;"><rect x="40" y="20" width="420" height="380" rx="6" fill="#F7F2E8" stroke="#B0A890" stroke-width="2"/><text x="195" y="50" text-anchor="middle" font-size="8.5" fill="#8C8070" font-family="serif">교사 구역</text></svg></div>';
    html+='<div class="grid">';
    for(let sh of state.shelves){let t=sh.floors.reduce((a,f)=>a+f.items.length,0);html+=`<div class="tile" onclick="state.selectedId='${sh.id}';state.view='shelf';render();"><div class="tile-n">${sh.name}</div><div class="tile-s">${sh.floors.length}층 · ${t}종</div></div>`;}
    html+='</div>';
  }else if(state.view==='search'){
    let q=(document.querySelector('[data-q]')?.value||'').toLowerCase();
    html+=`<input class="inp" data-q style="margin-bottom:14px;font-size:13px;" placeholder="🔍 기자재 이름으로 검색…" onkeyup="render();"/>`;
    let res=[];if(q){for(let sh of state.shelves)for(let f of sh.floors)for(let it of f.items)if(it.name.toLowerCase().includes(q))res.push({it,f,sh});}
    if(q&&res.length===0)html+='<div class="empty"><div style="font-size:28px;margin-bottom:10px;">🌿</div>검색 결과 없음</div>';
    else if(!q)html+='<div class="empty"><div style="font-size:32px;margin-bottom:10px;">🔬</div>기자재 이름을 입력해보세요</div>';
    else for(let {it,f,sh} of res)html+=`<div class="card" style="display:flex;align-items:center;gap:12px;cursor:pointer;" onclick="state.selectedId='${sh.id}';state.view='shelf';render();"><div style="width:10px;height:10px;border-radius:2px;background:${it.color||'#2D3561'};flex-shrink:0;"/><div><div style="font-weight:600;font-size:13px;color:#2D3561;margin-bottom:3px;">${it.name}</div><div style="font-size:10px;color:#8C8070;"><span class="tag" style="background:#2D356112;color:#2D3561;">${sh.name}</span> ${f.label} 수량 ${it.qty}</div></div><div style="color:#C0B8A8;">›</div></div>`;
  }else if(state.view==='shelf'&&state.selectedId){
    let sh=state.shelves.find(s=>s.id===state.selectedId);
    if(sh){html+=`<div style="display:flex;align-items:center;gap:8px;margin-bottom:14px;flex-wrap:wrap;"><button class="btn-s" onclick="state.view='map';state.selectedId=null;render();">← 약도</button><span style="font-family:'Playfair Display',serif;font-weight:600;font-size:17px;color:#2D3561;">${sh.name}</span><span style="font-size:10px;color:#8C8070;font-style:italic;">${sh.floors.length}층</span></div>`;
      for(let f of sh.floors){html+=`<div class="card" style="border-left:3px solid #2D3561;"><div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;"><div style="display:flex;align-items:center;gap:7px;"><div style="width:24px;height:24px;border-radius:5px;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;background:#2D356110;color:#2D3561;">${f.label.replace('층','')}</div><span style="font-weight:600;font-size:13px;color:#2D3561;">${f.label}</span><span class="tag" style="background:#2D356112;color:#2D3561;">${f.items.length}종</span></div>${state.isAdmin?`<button class="btn-p" onclick="newItemForm('add','${sh.id}','${f.id}');">+ 등록</button>`:''}</div>`;
        if(f.items.length===0)html+=`<div style="padding:12px 0;text-align:center;color:#B0A890;font-size:10px;border:1px dashed #D4CCBB;border-radius:7px;font-style:italic;font-family:'Playfair Display',serif;">${state.isAdmin?'+ 등록 버튼으로 추가':'등록된 기자재 없음'}</div>`;
        else for(let it of f.items){let col={정상:'#1E7A44',부족:'#C85A1A',점검필요:'#B83232',없음:'#94A3B8'};html+=`<div class="icard"><div style="display:flex;align-items:center;gap:8px;"><div style="width:8px;height:8px;border-radius:2px;background:${it.color||'#2D3561'};flex-shrink:0;"/><span style="flex:1;font-size:12px;color:#2D3561;font-weight:600;">${it.name}</span>${state.isAdmin?`<button class="btn-g" onclick="editItemForm('${sh.id}','${f.id}','${it.id}');">✏</button><button class="btn-d" onclick="delItem('${sh.id}','${f.id}','${it.id}');">🗑</button>`:''}</div><div style="display:flex;gap:8px;margin-top:6px;align-items:center;flex-wrap:wrap;"><div style="display:flex;align-items:center;gap:3px;"><span style="font-size:10px;color:#8C8070;">수량</span><span style="font-size:11px;font-weight:700;color:#2D3561;background:#FDFAF3;border:1px solid #D4CCBB;border-radius:4px;padding:1px 6px;">${it.qty}</span></div><div style="display:flex;align-items:center;gap:2px;"><span style="display:inline-block;width:6px;height:6px;border-radius:99px;margin-right:4px;background:${col[it.status]||'#2D3561'};"/><span style="font-size:10px;color:${col[it.status]||'#2D3561'};font-weight:600;">${it.status}</span></div></div>${it.memo?`<div style="margin-top:6px;font-size:10px;color:#6B6358;background:#F0EBE0;border:1px solid #DDD5C5;border-radius:6px;padding:5px 8px;font-style:italic;">📝 ${it.memo}</div>`:''}`;
        }
        html+='</div>';
      }
    }
  }
  html+='</div>';

  if(state.showPin)html+=`<div class="modal-bg" onclick="if(event.target===this)state.showPin=false,render();"><div class="modal" onclick="event.stopPropagation();"><div class="modal-t">관리자 로그인</div><div style="font-size:11px;color:#8C8070;margin-bottom:12px;font-style:italic;">PIN</div><input type="password" id="pin" class="inp" style="letter-spacing:6px;text-align:center;margin-bottom:8px;" placeholder="••••" autofocus/><div id="pinErr" style="color:#B83232;font-size:10px;margin-bottom:6px;text-align:center;display:none;">오류</div><div style="display:flex;gap:8px;"><button class="btn-p" style="flex:1;" onclick="tryLogin()">확인</button><button class="btn-s" style="flex:1;" onclick="state.showPin=false;render();">취소</button></div></div></div>`;
  if(state.showCP)html+=`<div class="modal-bg" onclick="if(event.target===this)state.showCP=false,render();"><div class="modal" onclick="event.stopPropagation();"><div class="modal-t">PIN 변경</div><label class="lbl">현재</label><input type="password" id="old" class="inp" style="letter-spacing:4px;text-align:center;margin-bottom:10px;"/><label class="lbl">새 PIN</label><input type="password" id="new" class="inp" style="letter-spacing:4px;text-align:center;margin-bottom:10px;"/><label class="lbl">확인</label><input type="password" id="new2" class="inp" style="letter-spacing:4px;text-align:center;margin-bottom:10px;"/><div id="cpErr" style="color:#B83232;font-size:10px;margin-bottom:6px;text-align:center;display:none;"></div><div style="display:flex;gap:8px;"><button class="btn-p" style="flex:1;" onclick="tryChangePin()">변경</button><button class="btn-s" style="flex:1;" onclick="state.showCP=false;render();">취소</button></div></div></div>`;
  if(state.itemForm){let it=state.itemForm.item||{};let cols=['#94A3B8','#B83232','#C85A1A','#A08010','#1E7A44','#2D3561','#622C82','#7A4A1E'];html+=`<div class="modal-bg" onclick="if(event.target===this)state.itemForm=null,render();"><div class="modal" onclick="event.stopPropagation();"><div class="modal-t">${state.itemForm.mode==='add'?'기자재 등록':'수정'}</div><label class="lbl">이름</label><input type="text" id="iname" class="inp" value="${it.name||''}" placeholder="비커…" style="margin-bottom:12px;" autofocus/><div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px;"><div><label class="lbl">수량</label><div style="display:flex;align-items:center;gap:4px;"><button class="btn-g" onclick="chQty(-1)">−</button><input type="number" id="iqty" class="inp" value="${it.qty||1}" style="text-align:center;padding:6px 4px;"/><button class="btn-g" onclick="chQty(1)">＋</button></div></div><div><label class="lbl">상태</label><select id="istat" class="inp" style="padding:6px 8px;cursor:pointer;"><option>정상</option><option>부족</option><option>점검필요</option><option>없음</option></select></div></div><label class="lbl">색상</label><div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px;">${cols.map(c=>`<button style="width:20px;height:20px;border-radius:99px;border:${it.color===c?'3px':'3px'} solid ${it.color===c?'#2D3561':'transparent'};background:${c};cursor:pointer;padding:0;" onclick="document.getElementById('icol').value='${c}';render();"/>`).join('')}</div><input type="hidden" id="icol" value="${it.color||'#2D3561'}"/><label class="lbl">메모</label><textarea id="imemo" class="inp" style="resize:vertical;min-height:45px;margin-bottom:12px;font-family:'Noto Serif KR',sans-serif;" placeholder="위치…">${it.memo||''}</textarea><div style="display:flex;gap:8px;"><button class="btn-p" style="flex:1;" onclick="saveItem()">저장</button><button class="btn-s" style="flex:1;" onclick="state.itemForm=null;render();">취소</button></div></div></div>`;
  }

  if(state.toast)html+=`<div class="toast ${state.toast.t}">${state.toast.msg}</div>`;
  r.innerHTML=html;
}

function tryLogin(){let p=document.getElementById('pin').value;if(p===state.adminPin){state.isAdmin=true;state.showPin=false;showToast('관리자모드');}else{document.getElementById('pinErr').style.display='block';document.getElementById('pin').value='';}}
function tryChangePin(){let o=document.getElementById('old').value,n=document.getElementById('new').value,n2=document.getElementById('new2').value,e=document.getElementById('cpErr');if(o!==state.adminPin){e.textContent='PIN 오류';e.style.display='block';return;}if(n.length<4){e.textContent='4자리';e.style.display='block';return;}if(n!==n2){e.textContent='불일치';e.style.display='block';return;}state.adminPin=n;state.showCP=false;save();showToast('PIN변경');}
function newItemForm(m,sid,fid){state.itemForm={mode:m,shelfId:sid,floorId:fid,item:{name:'',qty:1,status:'정상',color:'#2D3561',memo:''},itemId:null};render();}
function editItemForm(sid,fid,iid){let sh=state.shelves.find(s=>s.id===sid),f=sh.floors.find(f=>f.id===fid),it=f.items.find(i=>i.id===iid);state.itemForm={mode:'edit',shelfId:sid,floorId:fid,item:{...it},itemId:iid};render();}
function saveItem(){let n=document.getElementById('iname').value.trim();if(!n)return;let it={id:state.itemForm.itemId||genId(),name:n,qty:parseInt(document.getElementById('iqty').value)||1,status:document.getElementById('istat').value,color:document.getElementById('icol').value,memo:document.getElementById('imemo').value.trim()};updateShelf(ss=>{let sh=ss.find(s=>s.id===state.itemForm.shelfId),f=sh.floors.find(f=>f.id===state.itemForm.floorId);if(state.itemForm.mode==='edit'){let idx=f.items.findIndex(i=>i.id===state.itemForm.itemId);if(idx!==-1)f.items[idx]=it;}else f.items.push(it);return ss;});state.itemForm=null;showToast('저장');}
function delItem(sid,fid,iid){updateShelf(ss=>{let sh=ss.find(s=>s.id===sid),f=sh.floors.find(f=>f.id===fid);f.items=f.items.filter(i=>i.id!==iid);return ss;});showToast('삭제','info');}
function chQty(d){let q=parseInt(document.getElementById('iqty').value)||1;document.getElementById('iqty').value=Math.max(0,q+d);}

db.ref("biolab").on("value",snap=>{let d=snap.val();if(d){if(d.shelves)state.shelves=d.shelves;if(d.adminPin)state.adminPin=d.adminPin;state.synced=true;}state.loaded=true;render();});
render();
</script>
</body>
</html>
