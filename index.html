<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Biology Lab</title>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600&family=Noto+Serif+KR:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    /* 기존 스타일 그대로 */
  </style>
</head>
<body>
  <div id="root"></div>
  <script>
    // 안전하게 Firebase 초기화 및 Fallback
    let db = null;
    let firebaseReady = false;
    try {
      if (window.firebase && firebase?.initializeApp) {
        firebase.initializeApp({
          apiKey: "AIzaSyAAKEXvF9ckBxPkHsg9Nl021sb7EFAR40Q",
          authDomain: "bio-let-a1691.firebaseapp.com",
          databaseURL: "https://bio-let-a1691-default-rtdb.firebaseio.com",
          projectId: "bio-let-a1691",
          storageBucket: "bio-let-a1691.firebasestorage.app",
          messagingSenderId: "816068959265",
          appId: "1:816068959265:web:5de48f1bc5899407dbd760"
        });
        db = firebase.database();
        firebaseReady = true;
      }
    } catch (e) {
      console.error("Firebase init error:", e);
      db = null;
      firebaseReady = false;
    }

    let state = {
      shelves: [
        {id:"L1",name:"왼쪽 선반 1",color:"#2D3561",floors:[{id:"L1-f1",label:"1층",items:[]},{id:"L1-f2",label:"2층",items:[]}]},
        {id:"L2",name:"왼쪽 선반 2",color:"#2D3561",floors:[{id:"L2-f1",label:"1층",items:[]},{id:"L2-f2",label:"2층",items:[]}]},
        {id:"L3",name:"왼쪽 선반 3",color:"#2D3561",floors:[{id:"L3-f1",label:"1층",items:[]},{id:"L3-f2",label:"2층",items:[]}]},
        {id:"L4",name:"왼쪽 선반 4",color:"#2D3561",floors:[{id:"L4-f1",label:"1층",items:[]},{id:"L4-f2",label:"2층",items:[]}]},
        {id:"L5",name:"왼쪽 선반 5",color:"#2D3561",floors:[{id:"L5-f1",label:"1층",items:[]},{id:"L5-f2",label:"2층",items:[]}]},
        {id:"L6",name:"왼쪽 선반 6",color:"#2D3561",floors:[{id:"L6-f1",label:"1층",items:[]},{id:"L6-f2",label:"2층",items:[]}]},
        {id:"drug",name:"약품보관장",color:"#2D3561",floors:[{id:"drug-f1",label:"1층",items:[]},{id:"drug-f2",label:"2층",items:[]}]},
        {id:"R1",name:"오른쪽 선반",color:"#2D3561",floors:[{id:"R1-f1",label:"1층",items:[]}]},
      ],
      adminPin: "1234",
      view: "map",
      selectedId: null,
      isAdmin: false,
      showPin: false,
      showCP: false,
      itemForm: null,
      toast: null,
      synced: false,
      loaded: false,
      loadError: null,
    };

    // 타임아웃 설정 (8초)
    const loadTimeout = setTimeout(() => {
      if (!state.loaded) {
        state.loaded = true;
        state.loadError = "연결 시간 초과. 저장된 데이터로 진행합니다.";
        render();
      }
    }, 8000);

    function save() {
      try {
        if (db) {
          db.ref("biolab").set({shelves: state.shelves, adminPin: state.adminPin})
            .then(() => {
              state.synced = true;
              render();
            })
            .catch(e => {
              console.error("Save error:", e);
              state.synced = false;
              render();
            });
        } else {
          console.warn("Firebase 미연결: 변경사항이 로컬에만 반영됩니다.");
          state.synced = false;
        }
      } catch (e) {
        console.error("Save fatal exception:", e);
        state.synced = false;
      }
    }

    if (db) {
      db.ref("biolab").on("value", snap => {
        try {
          clearTimeout(loadTimeout);
          const d = snap.val();
          if (d) {
            if (d.shelves) state.shelves = d.shelves;
            if (d.adminPin) state.adminPin = d.adminPin;
            state.synced = true;
          }
          state.loaded = true;
          state.loadError = null;
          render();
        } catch (e) {
          console.error("Snapshot error:", e);
          state.loaded = true;
          state.loadError = "데이터 처리 오류가 발생했습니다.";
          render();
        }
      }, (err) => {
        console.error("DB error:", err);
        clearTimeout(loadTimeout);
        state.loaded = true;
        state.loadError = "Firebase 연결 오류. 오프라인 모드로 진행합니다.";
        state.synced = false;
        render();
      });
    } else {
      clearTimeout(loadTimeout);
      state.loaded = true;
      state.synced = false;
      state.loadError = "Firebase 미연결. 오프라인 모드로 진행합니다.";
      // render(); // 최초 호출에서 render와 중첩되면 중복 호출 피함
    }
    // window.w = ... 이하 기존 핸들러/render 그대로 사용
  </script>
</body>
</html>
